<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>COLLECTIONS | Trading Cards</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 50px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 10px; display: inline-block; border: 2px solid #ff6600; }
        input { padding: 10px; font-size: 16px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; font-size: 16px; background: #ff6600; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #mensaje { margin-top: 20px; font-size: 18px; color: #ff6600; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <h1>COLLECTIONS</h1>
        <p>Bienvenido coleccionista</p>
        <input type="text" id="nombreUsuario" placeholder="Escribe tu nombre...">
        <button onclick="procesar()">Saludar</button>
        
        <p id="mensaje"></p>
        <div id="info"></div>
    </div>

    <script>
        function procesar() {
            // 1. Capturar el valor del input
            var nombre = document.getElementById("nombreUsuario").value.trim();
            var pSaludo = document.getElementById("mensaje");
            var divInfo = document.getElementById("info");

            // 2. Condicionales para validar
            if (nombre === "") {
                pSaludo.innerHTML = "Por favor, ingresa un nombre.";
                divInfo.innerHTML = "Campo vacío.";
            } else {
                // 3. Mostrar saludo y contar caracteres
                pSaludo.innerHTML = "Hola, " + nombre;
                divInfo.innerHTML = "Tu nombre tiene " + nombre.length + " caracteres.";
            }
        }
    </script>
</body>
</html>
